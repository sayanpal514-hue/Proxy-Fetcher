name: Update Proxy
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual triggering
  push:
    branches:
      - main
    paths:
      - 'main.py'

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    concurrency:
      group: update-playlist
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz
          # Or if you have requirements.txt:
          # pip install -r requirements.txt

      - name: Run main.py
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config user.name "sayanpal514-hue"
          git config user.email "223531683+sayanpal514-hue@users.noreply.github.com"
          git add live.txt
          git commit -m "Auto-update proxy: $(date)" || echo "No changes to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push failed, retrying in 5s... (attempt $i)"
            sleep 5
          done
